# Official AI MPC. No XY smoothing or inward path offset.
ctrl_period: 0.03333333333333333
enable_path_smoothing: false
enable_yaw_recalculation: true
traj_resample_dist: 0.25
curvature_smoothing_num: 10
admisible_position_error: 0.8
admisible_yaw_error_deg: 25.0
output_interface: ctrl_raw
vehicle_model_wheelbase: 3.0
steer_lim_deg: 40.0
# Two-state official model: no unavailable measured steering input required.
# Pure input delay compensation remains enabled; not a full actuator-lag model.
vehicle_model_type: kinematics_no_delay
vehicle_model_steer_tau: 0.15
delay_compensation_time: 0.20
mpc_prediction_horizon: 30
mpc_prediction_sampling_time: 0.1
mpc_weight_lat_error: 1.0
mpc_weight_heading_error: 0.0
mpc_weight_heading_error_squared_vel_coeff: 0.3
mpc_weight_steering_input: 1.0
mpc_weight_steering_input_squared_vel_coeff: 0.25
mpc_weight_lat_jerk: 0.1
mpc_weight_terminal_lat_error: 1.0
mpc_weight_terminal_heading_error: 0.1
mpc_zero_ff_steer_deg: 0.0
steering_lpf_cutoff_hz: 3.0
error_deriv_lpf_curoff_hz: 5.0
qp_solver_type: qpoases_hotstart
qpoases_max_iter: 500
show_debug_info: false
