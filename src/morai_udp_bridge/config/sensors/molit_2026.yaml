# UDP transport/ROS topic contract only. Sensor frame and camera-model metadata
# are injected from ioniq5_description by morai_bringup. Every port must match
# the SIM UI.
bind_ip: 0.0.0.0
allowed_source_ip: ""
receive_buffer_bytes: 4194304
diagnostics_period: 1.0

cameras:
  front:
    port: 9291
    topic: /image/front/compressed
    camera_info_topic: /image/front/camera_info
    packet_layout: auto
    # Keep camera/IMU/LiDAR on the same ROS receive-time clock by default.
    use_sensor_time: false
    stale_timeout: 0.5
    max_hz: 30.0
  left:
    port: 9293
    topic: /image/left/compressed
    camera_info_topic: /image/left/camera_info
    packet_layout: auto
    use_sensor_time: false
    stale_timeout: 0.5
    max_hz: 30.0
  right:
    port: 9295
    topic: /image/right/compressed
    camera_info_topic: /image/right/camera_info
    packet_layout: auto
    use_sensor_time: false
    stale_timeout: 0.5
    max_hz: 30.0

gps:
  enabled: true
  port: 9301
  topic: /sensors/gps/fix
  stale_timeout: 1.0
  max_hz: 30.0

imu:
  enabled: true
  port: 9303
  topic: /sensors/imu/data
  packet_layout: auto
  use_sensor_time: false
  stale_timeout: 0.5
  max_hz: 50.0
